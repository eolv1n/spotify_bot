# Production: EU direct egress; Yandex uses YANDEX_PROXY_URL from runtime env.
# Use ./deploy.sh in production and ./scripts/dev.sh for local development.
services:
  spotify_bot:
    build:
      context: .
    image: spotify_bot:latest
    container_name: spotify_bot
    env_file:
      - ${PROD_BOT_ENV_FILE:?Set PROD_BOT_ENV_FILE to the external production env file}
    volumes:
      - ${PROD_BOT_CACHE_DIR:?Set PROD_BOT_CACHE_DIR to the external production cache directory}:/app/cache
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 300m
    cpus: 0.50
