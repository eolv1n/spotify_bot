name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after the operator opens a timed SSH window
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint (flake8)
        run: |
          flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          pytest -q \
            --cov=. \
            --cov-branch \
            --junitxml=report.xml \
            --cov-report=html

      - name: Run smoke test script
        run: |
          chmod +x tests/e2e/smoke.sh
          tests/e2e/smoke.sh

      - name: Test production smoke guardrails
        run: |
          chmod +x scripts/prod_smoke.sh tests/e2e/prod_smoke_test.sh
          tests/e2e/prod_smoke_test.sh
          bash tests/e2e/actions_deploy_test.sh

      - name: Test Compose runtime guardrails
        run: |
          chmod +x scripts/dev.sh tests/e2e/compose_guard_test.sh \
            tests/e2e/wg_bootstrap_dns_test.sh
          tests/e2e/compose_guard_test.sh
          tests/e2e/wg_bootstrap_dns_test.sh

      - name: Upload JUnit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-report
          path: report.xml

      - name: Upload coverage HTML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: htmlcov

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build Docker image (sanity check)
        run: |
          docker build -t spotify_bot:test .

  deploy:
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy
    steps:
      - name: Publish deployment runner address
        id: runner
        run: |
          ip=$(curl -4fsS --max-time 10 https://api.ipify.org)
          IP="$ip" python3 -c 'import ipaddress, os; assert ipaddress.ip_address(os.environ["IP"]).version == 4'
          printf '%s\n' "$ip" > runner-ip.txt
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
      - name: Share address with operator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-ip-${{ steps.runner.outputs.ip }}
          path: runner-ip.txt
          retention-days: 1
      - name: Wait for operator's SSH window
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          for attempt in $(seq 1 90); do
            if timeout 3 bash -c 'echo > /dev/tcp/$DEPLOY_HOST/22' 2>/dev/null; then exit 0; fi
            sleep 3
          done
          echo 'SSH window did not open in time' >&2
          exit 1
      - name: Deploy to Debian VPS over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: SHA256:Vh4m6kgsnecXVx9ixYb/QKmkMW6meYLPiv6Cr7X0WF8
          envs: TELEGRAM_TOKEN,SPOTIFY_CLIENT_ID,SPOTIFY_CLIENT_SECRET
          script_stop: true
          script: |
            set -eu
            test -n "$TELEGRAM_TOKEN" && test -n "$SPOTIFY_CLIENT_ID" && test -n "$SPOTIFY_CLIENT_SECRET"
            sudo install -d -m 700 /opt/spotify_bot_runtime
            sudo install -d -m 700 -o 1000 -g 1000 /opt/spotify_bot_runtime/cache
            if sudo test -f /opt/spotify_bot_runtime/bot.env; then
              sudo cp -p /opt/spotify_bot_runtime/bot.env /opt/spotify_bot_runtime/bot.env.before-deploy
            else
              sudo rm -f /opt/spotify_bot_runtime/bot.env.before-deploy
            fi
            printf 'TELEGRAM_TOKEN=%s\nSPOTIFY_CLIENT_ID=%s\nSPOTIFY_CLIENT_SECRET=%s\nAUTO_DELETE_DELAY=3\nCACHE_DB_PATH=cache/music_cache.sqlite3\nCACHE_TTL_SECONDS=43200\nYANDEX_PROXY_URL=http://10.243.95.1:21081\n' "$TELEGRAM_TOKEN" "$SPOTIFY_CLIENT_ID" "$SPOTIFY_CLIENT_SECRET" | sudo sh -c 'umask 077; cat > /opt/spotify_bot_runtime/bot.env.new; mv /opt/spotify_bot_runtime/bot.env.new /opt/spotify_bot_runtime/bot.env'
            if ! sudo env EXPECTED_SHA='${{ github.sha }}' bash -eu -c '
              if [ ! -d /opt/spotify_bot/.git ]; then
                git clone --branch main https://github.com/eolv1n/spotify_bot.git /opt/spotify_bot
              fi
              cd /opt/spotify_bot
              git fetch origin main
              git checkout main
              git pull --ff-only origin main
              export BOT_ENV_FILE=/opt/spotify_bot_runtime/bot.env BOT_CACHE_DIR=/opt/spotify_bot_runtime/cache
              ./deploy.sh
            '; then
              if sudo test -f /opt/spotify_bot_runtime/bot.env.before-deploy; then
                sudo mv /opt/spotify_bot_runtime/bot.env.before-deploy /opt/spotify_bot_runtime/bot.env
                sudo env BOT_ENV_FILE=/opt/spotify_bot_runtime/bot.env BOT_CACHE_DIR=/opt/spotify_bot_runtime/cache bash -c 'cd /opt/spotify_bot && export PROD_BOT_ENV_FILE="$BOT_ENV_FILE" PROD_BOT_CACHE_DIR="$BOT_CACHE_DIR"; docker compose up -d --force-recreate spotify_bot && ./scripts/prod_smoke.sh' || true
              else
                sudo docker stop spotify_bot >/dev/null 2>&1 || true
              fi
              exit 1
            fi
