name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after the operator opens a timed SSH window
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint (flake8)
        run: |
          flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          pytest -q \
            --cov=. \
            --cov-branch \
            --junitxml=report.xml \
            --cov-report=html

      - name: Run smoke test script
        run: |
          chmod +x tests/e2e/smoke.sh
          tests/e2e/smoke.sh

      - name: Test production smoke guardrails
        run: |
          chmod +x scripts/prod_smoke.sh tests/e2e/prod_smoke_test.sh
          tests/e2e/prod_smoke_test.sh

      - name: Test Compose runtime guardrails
        run: |
          chmod +x scripts/dev.sh tests/e2e/compose_guard_test.sh \
            tests/e2e/wg_bootstrap_dns_test.sh
          tests/e2e/compose_guard_test.sh
          tests/e2e/wg_bootstrap_dns_test.sh

      - name: Upload JUnit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-report
          path: report.xml

      - name: Upload coverage HTML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: htmlcov

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build Docker image (sanity check)
        run: |
          docker build -t spotify_bot:test .

  deploy:
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy
    steps:
      - name: Deploy to Debian VPS over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            export INSTALL_DIR=/opt/spotify_bot
            export BOT_ENV_FILE=/opt/spotify_bot_runtime/bot.env
            export BOT_CACHE_DIR=/opt/spotify_bot_runtime/cache

            if [ ! -d "$INSTALL_DIR/.git" ]; then
              git clone --branch main https://github.com/eolv1n/spotify_bot.git "$INSTALL_DIR"
            fi

            cd "$INSTALL_DIR"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            umask 077
            mkdir -p "$BOT_CACHE_DIR"
            if [ ! -f "$BOT_ENV_FILE" ]; then
              printf '%s\n' \
                "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}" \
                "SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}" \
                "SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}" \
                "AUTO_DELETE_DELAY=${{ secrets.AUTO_DELETE_DELAY }}" \
                "CACHE_DB_PATH=cache/music_cache.sqlite3" \
                "CACHE_TTL_SECONDS=${{ secrets.CACHE_TTL_SECONDS }}" \
                > "$BOT_ENV_FILE"
            fi
            chmod 600 "$BOT_ENV_FILE"
            ./deploy.sh
